<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — FineDust Works</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500&family=JetBrains+Mono:wght@400&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .lost { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 48px var(--gutter);
      background: radial-gradient(ellipse 900px 600px at 50% 55%, rgba(10,23,41,0.95), rgba(36,41,43,0.25) 45%, transparent 70%); }
    .lost img { width: 64px; height: auto; margin: 0 auto 36px; opacity: 0.9; }
    .lost h1 { font-family: var(--font-display); font-weight: 300; font-size: clamp(40px, 7vw, 88px); line-height: 1.05; letter-spacing: -0.04em; }
    .lost h1 span { color: var(--slate); }
    .lost p { margin: 20px auto 36px; color: var(--text-dim); max-width: 32ch; word-break: keep-all; }
  </style>
</head>
<body>
  <main class="lost">
    <div>
      <img src="/assets/logo.svg" alt="" width="64" height="72" />
      <p class="kicker">404 — Not found</p>
      <h1>흩어진 입자,<br /><span>여기엔 없어요.</span></h1>
      <p>찾으시는 페이지가 옮겨졌거나 처음부터 없었던 것 같습니다.</p>
      <a class="btn btn--solid" href="/">홈으로 돌아가기</a>
    </div>
  </main>
</body>
</html>
